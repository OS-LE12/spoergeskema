function fa(n){var i=FA[n];return "<svg class=\"fa\" viewBox=\""+i[0]+"\" aria-hidden=\"true\" focusable=\"false\"><path d=\""+i[1]+"\"/></svg>"}
var SC={"title":"TEST","description":"","questions":[],"outcomes":[],"showResults":true,"showCount":1};
var GH_REPO="OS-LE12/spoergeskema_admin";
var GH_T1="github_p",GH_T2="at_11CGIOXUA0iGG",GH_T3="vRDgqcKpJ_b23ei65QeNRba9c9qPDuqtCBXdKpRZakmyXDhGUHn5yMHEPNLK4IKqS9JvH";
var GH_FILE="data.json";
var SID="smw3dxfzuw66";
var qs={qIdx:0,answers:{},history:[],done:false,contactDone:false,contact:null};
function uid(){return "_"+Math.random().toString(36).slice(2,8)}
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""}
function getNext(q,aid){
  var o=(q.options||[]).find(function(x){return x.id===aid});
  if(o&&o.nextQ==="__end__")return -1;
  if(o&&o.nextQ){var i=SC.questions.findIndex(function(x){return x.id===o.nextQ});return i>=0?i:-1}
  var c=SC.questions.findIndex(function(x){return x.id===q.id});
  return c+1<SC.questions.length?c+1:-1;
}
function koOpt(q,ans){
  var a=Array.isArray(ans)?ans:[ans];
  return (q.options||[]).find(function(o){return o.knockout&&a.indexOf(o.id)>=0})||null;
}
// answers that may count towards an outcome: no screening questions, no knockout options
function scoreVals(){
  var out=[];
  SC.questions.forEach(function(q){
    if(q.screening)return;
    var a=qs.answers[q.id];if(a===undefined||a===null)return;
    (Array.isArray(a)?a:[a]).forEach(function(v){
      var o=(q.options||[]).find(function(x){return x.id===v});
      if(!(o&&o.knockout))out.push(v);
    });
  });
  return out;
}
function showN(){return SC.showCount===2?2:1}
function calcR(){
  var vals=scoreVals();
  return SC.outcomes.map(function(o){
    var hits=o.keywords.filter(function(k){return vals.indexOf(k)>=0}).length;
    var pct=o.keywords.length>0?Math.round(hits/o.keywords.length*100):0;
    return Object.assign({},o,{pct:pct});
  }).sort(function(a,b){return b.pct-a.pct});
}
async function sendToGitHub(){
  if(!GH_REPO)return false;
  var token=GH_T1+GH_T2+GH_T3;
  if(!token||token.length<10)return false;
  try{
    var resp={id:uid(),timestamp:Date.now(),contact:qs.contact,answers:qs.answers,topOutcome:qs.screened||SC.showResults===false?null:(calcR()[0]&&calcR()[0].title||null),completed:true};
    if(qs.screened){resp.screenedOut=true;resp.screenOut={q:qs.screened.q,o:qs.screened.o}}
    if(SID)resp.survey=SID;
    var r=await fetch("https://api.github.com/repos/"+GH_REPO+"/dispatches",{
      method:"POST",
      headers:{"Authorization":"token "+token,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
      body:JSON.stringify({event_type:"nyt-svar",client_payload:resp})
    });
    return r.status===204;
  }catch(e){return false}
}
function render(){
  var c=document.getElementById("app");
  if(!qs.contactDone){renderContact(c);return}
  if(!SC.questions.length){c.innerHTML="<p>Ingen sp\u00f8rgsm\u00e5l.</p>";return}
  if(qs.done||qs.qIdx===-1){renderResult(c);return}
  var q=SC.questions[qs.qIdx];if(!q){renderResult(c);return}
  var sel=qs.answers[q.id]||null;
  var selArr=Array.isArray(sel)?sel:(sel?[sel]:[]);
  var pct=Math.round((qs.qIdx+1)/SC.questions.length*100);
  var hasAns=q.type==="multi"?selArr.length>0:(!!sel||q.type==="text");
  var opts="";
  if(q.type==="text"){
    opts="<textarea class=\"sa\" id=\"ti\" placeholder=\"Skriv dit svar...\">"+esc(Array.isArray(sel)?sel.join(", "):sel||"")+"</textarea>";
  } else if(q.type==="multi"){
    opts="<div style=\"font-size:calc(12px*var(--fs,1));color:var(--t3);margin-bottom:8px\">V\u00e6lg en eller flere</div>";
    (q.options||[]).forEach(function(o){
      var on=selArr.indexOf(o.id)>=0;
      opts+="<button class=\"obtn"+(on?" sel":"")+"\" data-qid=\""+q.id+"\" data-oid=\""+o.id+"\" data-multi=\"1\"><div class=\"rc\" style=\"border-radius:3px\"><div class=\"rd\"></div></div>"+esc(o.label)+"</button>";
    });
  } else {
    (q.options||[]).forEach(function(o){
      opts+="<button class=\"obtn"+(sel===o.id?" sel":"")+"\" data-qid=\""+q.id+"\" data-oid=\""+o.id+"\" data-single=\"1\"><div class=\"rc\"><div class=\"rd\"></div></div>"+esc(o.label)+"</button>";
    });
  }
  c.innerHTML="<div class=\"pbg\"><div class=\"pf\" style=\"width:"+Math.max(2,pct)+"%\"></div></div>"
    +"<div style=\"font-size:calc(12px*var(--fs,1));color:var(--t3);margin-bottom:6px\">Sp\u00f8rgsm\u00e5l "+(qs.qIdx+1)+" af "+SC.questions.length+"</div>"
    +(q.image?"<img src=\""+q.image+"\" class=\"qimg\" alt=\"\">":"")
    +"<div style=\"font-size:calc(20px*var(--fs,1));font-weight:500;margin-bottom:6px;line-height:1.4\">"+esc(q.text)+"</div>"
    +(q.sub?"<div style=\"font-size:calc(14px*var(--fs,1));color:var(--t2);margin-bottom:1.25rem;line-height:1.5\">"+esc(q.sub)+"</div>":"<div style=\"margin-bottom:1.25rem\"></div>")
    +opts      +"<div class=\"nav\">"+(qs.qIdx>0?"<button id=\"btn-bk\" class=\"btn\">"+fa("arrow-left")+" Tilbage</button>":"")
    +"<button id=\"btn-nx\" class=\"btn btnp\" "+(hasAns?"":"disabled")+">"+(qs.qIdx===SC.questions.length-1?"Se resultat ":"N\u00e6ste ")+fa("arrow-right")+"</button>"
    +"</div>";
  c.querySelectorAll("[data-single]").forEach(function(b){b.addEventListener("click",function(){qs.answers[b.dataset.qid]=b.dataset.oid;render()})});
  c.querySelectorAll("[data-multi]").forEach(function(b){b.addEventListener("click",function(){var cur=Array.isArray(qs.answers[b.dataset.qid])?qs.answers[b.dataset.qid]:[];var i=cur.indexOf(b.dataset.oid);if(i>=0)cur.splice(i,1);else cur.push(b.dataset.oid);qs.answers[b.dataset.qid]=cur.slice();render()})});
  var nx=document.getElementById("btn-nx");if(nx)nx.addEventListener("click",function(){goNext(q.id,q.type)});
  var bk=document.getElementById("btn-bk");if(bk)bk.addEventListener("click",function(){if(qs.history.length){qs.qIdx=qs.history.pop();qs.done=false;qs.screened=null;render()}});
}
function goNext(qid,type){
  if(type==="text"){var ta=document.getElementById("ti");if(ta)qs.answers[qid]=ta.value.trim()}
  var q=SC.questions[qs.qIdx];var ans=qs.answers[qid];var first=Array.isArray(ans)?ans[0]:ans;
  qs.history.push(qs.qIdx);
  var ko=koOpt(q,ans);
  if(ko){qs.screened={q:q.id,o:ko.id,msg:ko.koMsg||""};qs.done=true;render();return}
  qs.screened=null;
  var next=getNext(q,first);
  if(next===-1)qs.done=true;else qs.qIdx=next;
  render();
}
function renderContact(c){
  c.innerHTML="<div class=\"card\" style=\"margin-bottom:0\">"
    +"<h2 style=\"font-size:calc(18px*var(--fs,1));font-weight:500;margin-bottom:6px\">Inden vi starter</h2>"
    +"<p style=\"font-size:calc(14px*var(--fs,1));color:var(--t2)\">Fort\u00e6l os din alder. Navn er valgfrit.</p></div>"
    +"<div class=\"card\" style=\"margin-top:1px\">"
    +"<div style=\"margin-bottom:16px\"><label for=\"c-age\">Alder <span style=\"color:var(--err)\" aria-hidden=\"true\">*</span></label>"
    +"<input type=\"text\" id=\"c-age\" inputmode=\"numeric\" pattern=\"[0-9]*\" maxlength=\"3\" autocomplete=\"off\" aria-required=\"true\" placeholder=\"Din alder\" style=\"max-width:140px\"></div>"
    +"<div style=\"margin-bottom:16px\"><label for=\"c-name\">Navn (valgfrit)</label>"
    +"<input type=\"text\" id=\"c-name\" autocomplete=\"name\" placeholder=\"Dit navn\"></div>"
    +"<div id=\"c-err\" role=\"alert\" style=\"font-size:calc(13px*var(--fs,1));color:var(--err);margin-bottom:10px;display:none\">Angiv din alder som et tal.</div>"
    +"<button id=\"btn-start\" class=\"btn btnp\">Start sp\u00f8rgeskema "+fa("arrow-right")+"</button>"
    +"</div>";
  var btn=document.getElementById("btn-start");
  if(btn)btn.addEventListener("click",submitContact);
  ["c-age","c-name"].forEach(function(id){
    var inp=document.getElementById(id);
    if(inp)inp.addEventListener("keydown",function(e){if(e.key==="Enter")submitContact()});
  });
}
function submitContact(){
  var age=document.getElementById("c-age").value.trim();
  var name=document.getElementById("c-name").value.trim();
  var err=document.getElementById("c-err");
  var n=/^\d{1,3}$/.test(age)?parseInt(age,10):0;
  if(n<1||n>120){err.style.display="block";document.getElementById("c-age").focus();return}
  err.style.display="none";
  qs.contact={age:n};
  if(name)qs.contact.name=name;
  qs.contactDone=true;
  render();
}
function renderEnd(c,sub,msg){
  c.innerHTML="<div style=\"font-size:calc(20px*var(--fs,1));font-weight:500;margin-bottom:4px\">Tak for din besvarelse</div>"
    +(sub?"<div style=\"font-size:calc(14px*var(--fs,1));color:var(--t2);margin-bottom:1.5rem\">"+esc(sub)+"</div>":"<div style=\"margin-bottom:1.5rem\"></div>")
    +"<div class=\"rcard\"><div style=\"font-size:calc(15px*var(--fs,1));line-height:1.6\">"+esc(msg).replace(/\n/g,"<br>")+"</div></div>"
    +"<div class=\"send-box\"><h3>Dine svar er registreret</h3>"
    +"<p id=\"send-status\">Gemmer dine svar...</p>"
    +"<div class=\"nav\"><button id=\"btn-close\" class=\"btn btnp\" disabled>"+fa("xmark")+" Afslut</button></div></div>";
  if(!GH_REPO){var sh=c.querySelector(".send-box h3");if(sh)sh.textContent="Demo \u2013 svarene er ikke gemt"}
  var cb=document.getElementById("btn-close");

    if(st)st.textContent=ok?"Dine svar er gemt. Tak for din besvarelse.":"Tak for din besvarelse.";

}
function renderScreenOut(c){
  renderEnd(c,"Vi kan desv\u00e6rre ikke vise dig et resultat",qs.screened.msg||"Ud fra dit svar opfylder du desv\u00e6rre ikke kravene lige nu.");
}
function renderThanks(c){
  renderEnd(c,"",SC.thanksText||"Tak, fordi du har besvaret sp\u00f8rgeskemaet.");
}

function renderResult(c){
  if(qs.screened){renderScreenOut(c);return}
  if(SC.showResults===false){renderThanks(c);return}
  var results=calcR().filter(function(r){return r.pct>0});
  var html="<div style=\"font-size:calc(20px*var(--fs,1));font-weight:500;margin-bottom:4px\">"+(showN()===1?"Dit resultat":"Dine resultater")+"</div>"
    +"<div style=\"font-size:calc(14px*var(--fs,1));color:var(--t2);margin-bottom:1.5rem\">Baseret p\u00e5 dine svar</div>";
  if(!results.length){html+="<p style=\"color:var(--t2)\">Ingen matchende udfald.</p>"}
  else{results.slice(0,showN()).forEach(function(r,i){
    html+="<div class=\"rcard"+(i===0?" top":"")+"\">";
    if(i===0)html+="<div class=\"badge ba\" style=\"margin-bottom:8px\">"+fa("star")+" Bedste match</div>";
    html+="<div style=\"font-size:calc(17px*var(--fs,1));font-weight:500;color:"+(i===0?"var(--tod)":"var(--t)")+";margin-bottom:4px\">"+esc(r.title)+"</div>";
    html+="<div style=\"font-size:calc(14px*var(--fs,1));color:"+(i===0?"var(--tod2)":"var(--t2)")+";line-height:1.6;margin-bottom:10px\">"+esc(r.desc)+"</div>";
    if(r.tags&&r.tags.length)html+="<div class=\"tags\">"+r.tags.map(function(t){return"<span class=\"tag\">"+esc(t)+"</span>"}).join("")+"</div>";
    html+="</div>";
  })}
  html+="<div class=\"send-box\"><h3>Dine svar er registreret</h3>"
    +"<p id=\"send-status\">Gemmer dine svar...</p>"
    +"<div class=\"nav\">"
    +"<button id=\"btn-jpg\" class=\"btn btna\">"+fa("download")+" Download resultat som billede</button>"
    +"<button id=\"btn-close\" class=\"btn btnp\" disabled>"+fa("xmark")+" Afslut</button>"
    +"</div></div>";
  c.innerHTML=html;
  if(!GH_REPO){var sh=c.querySelector(".send-box h3");if(sh)sh.textContent="Demo \u2013 svarene er ikke gemt"}
  var cb=document.getElementById("btn-close");
  var st=document.getElementById("send-status");
  sendToGitHub().then(function(ok){
    if(st)st.textContent=ok?"Dine svar er gemt. Tak for din besvarelse.":"Tak for din besvarelse.";
    if(cb)cb.disabled=false;
  });
  if(cb)cb.addEventListener("click",function(){window.close()});
  var jb=document.getElementById("btn-jpg");
  if(jb)jb.addEventListener("click",downloadJPG);
}
function downloadJPG(){
  var results=calcR().filter(function(r){return r.pct>0});
  var rows=results.slice(0,showN());
  var W=640,pad=36,maxW=W-pad*2-20;
  var m=document.createElement("canvas").getContext("2d");
  function wrap(text,font,max,maxLines){
    m.font=font;
    var words=String(text||"").split(/\s+/),lines=[],cur="";
    words.forEach(function(w){
      var t=cur?cur+" "+w:w;
      if(cur&&m.measureText(t).width>max){lines.push(cur);cur=w}else cur=t;
    });
    if(cur)lines.push(cur);
    if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"\u2026"}
    return lines;
  }
  var TF="500 15px system-ui,sans-serif",DF="13px system-ui,sans-serif";
  var cards=rows.map(function(r,i){
    var t=wrap(r.title,TF,maxW,2),d=wrap(r.desc,DF,maxW,4);
    return{top:i===0,t:t,d:d,h:(i===0?36:14)+t.length*20+6+d.length*18+12};
  });
  var H=152+cards.reduce(function(n,c){return n+c.h+8},0)+pad;
  var canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext("2d");
  function rr(x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath();ctx.fill()}
  function star(x,y,sz){var k=sz/512;ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.fill(new Path2D(FA.star[1]));ctx.restore()}
  ctx.fillStyle="#EFECE4";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#333C35";ctx.fillRect(0,0,W,64);
  ctx.fillStyle="#EFECE4";ctx.font="500 16px system-ui,sans-serif";
  ctx.fillText(SC.title||"Sp\u00f8rgeskema",pad,36);
  ctx.fillStyle="#ABB892";ctx.font="13px system-ui,sans-serif";
  ctx.fillText(qs.contact&&qs.contact.name?"Resultat for: "+qs.contact.name:(showN()===1?"Dit resultat":"Dine resultater"),pad,54);
  var y=64+36;
  ctx.fillStyle="#333127";ctx.font="500 20px system-ui,sans-serif";
  ctx.fillText(showN()===1?"Dit resultat":"Dine resultater",pad,y);y+=28;
  ctx.fillStyle="#8a8d80";ctx.font="13px system-ui,sans-serif";
  ctx.fillText(new Date().toLocaleDateString("da-DK"),pad,y);y+=24;
  cards.forEach(function(c){
    ctx.fillStyle=c.top?"#333C35":"#F7F5EF";rr(pad,y,W-pad*2,c.h,4);
    if(c.top){ctx.fillStyle="#F0FE89";rr(pad+10,y+10,100,16,3);ctx.fillStyle="#252900";ctx.font="500 11px system-ui,sans-serif";star(pad+16,y+12,11);ctx.fillText("Bedste match",pad+31,y+22)}
    var ty=y+(c.top?36:14);
    ctx.fillStyle=c.top?"#EFECE4":"#333127";ctx.font=TF;
    c.t.forEach(function(l,k){ctx.fillText(l,pad+10,ty+14+k*20)});
    ctx.fillStyle=c.top?"#ABB892":"#5a5d53";ctx.font=DF;
    c.d.forEach(function(l,k){ctx.fillText(l,pad+10,ty+c.t.length*20+6+14+k*18)});
    y+=c.h+8;
  });
  var a=document.createElement("a");
  a.href=canvas.toDataURL("image/jpeg",0.95);
  var nm=qs.contact&&qs.contact.name?qs.contact.name.replace(/\s+/g,"-"):"resultat";
  a.download="resultat-"+nm+".jpg";
  a.click();
}
